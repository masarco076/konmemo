<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>コンメモ</title>
<meta name="description" content="献立と買い物リストを整理するアプリ" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F8F1E4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="コンメモ" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F8F1E4; }
  body {
    font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* 全画面アプリ枠。スマホでは全幅、広い画面では中央に430px幅で表示 */
  #root {
    position: fixed;
    top: 0; bottom: 0;
    left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    overflow: hidden;
    background: #F8F1E4;
    /* iOS のホームインジケータ／ノッチ安全領域 */
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #root *::-webkit-scrollbar { display: none; }
  #root * { scrollbar-width: none; }
  /* 初期ローディング */
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #A39E92; font-size: 13px; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="root"><div id="boot">コンメモ…</div></div>

<script>
/* ───────── 無料・オフラインのローカル解析シム ─────────
   design環境の window.claude.complete（外部AI）は本番に存在しないため、
   端末内のキーワード抽出で同じJSON形式を返す。外部送信ゼロ・課金ゼロ。 */
(function () {
  if (window.claude && typeof window.claude.complete === 'function') return;
  var VOCAB = {
    cuisine: { '和食':['和食','和','和風','日本'], '洋食':['洋食','洋風','西洋'], '中華':['中華','中華風'],
               'イタリアン':['イタリア','パスタ','ピザ'], 'エスニック':['エスニック','タイ','ベトナム','アジア'],
               '韓国料理':['韓国','キムチ','チゲ','韓'] },
    type: { '麺類':['麺','ラーメン','うどん','そば','パスタ','スパ','焼きそば','そうめん'],
            '丼物':['丼','どんぶり','親子丼','牛丼'], '炒め物':['炒め','いため'],
            '焼き物':['焼き','焼く','グリル','ソテー'], '煮物':['煮','煮込み','シチュー','カレー'],
            '揚げ物':['揚げ','フライ','天ぷら','唐揚げ','からあげ'], 'サラダ':['サラダ','生野菜'],
            '一品で完結':['一品','ワンプレート','簡単に済','これだけ'] },
    feel: { 'ご飯がすすむ':['ご飯がすすむ','ごはんがすすむ','こってり','濃い味','がっつりご飯'],
            'さっぱり':['さっぱり','あっさり','軽め','ヘルシー','酸味'], 'がっつり':['がっつり','ボリューム','スタミナ','肉'],
            '時短':['時短','早く','すぐ','簡単','手早','15分','10分'], '野菜たっぷり':['野菜','ベジ','緑黄色'],
            'ピリ辛':['辛','ピリ辛','スパイシー','激辛'] }
  };
  function extract(text) {
    var out = { cuisine: [], type: [], feel: [], mood: [] };
    Object.keys(VOCAB).forEach(function (cat) {
      Object.keys(VOCAB[cat]).forEach(function (label) {
        if (VOCAB[cat][label].some(function (kw) { return text.indexOf(kw) !== -1; })) {
          if (out[cat].indexOf(label) === -1) out[cat].push(label);
        }
      });
    });
    return out;
  }
  window.claude = {
    complete: function (prompt) {
      return new Promise(function (resolve) {
        var m = prompt.split('文:');
        var text = m.length > 1 ? m[m.length - 1] : prompt;
        resolve(JSON.stringify(extract(text)));
      });
    }
  };
})();
</script>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="data.js"></script>
<script src="variant-a.js"></script>
<script>
(function () {
  var rootEl = document.getElementById('root');
  try {
    rootEl.innerHTML = '';
    ReactDOM.createRoot(rootEl).render(React.createElement(window.VariantA));
  } catch (e) {
    rootEl.innerHTML = '<div style="padding:40px;color:#6B6357;font-size:14px;line-height:1.8">'
      + '起動に失敗しました。ページを再読み込みしてください。<br><small>' + (e && e.message ? e.message : e) + '</small></div>';
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
